[package]
name = "ricky_redis_rs"
version = "0.1.0"
edition = "2018"
authors = ["Ricky <1049469060@qq.com>"]
license = "APACHE"
readme = "README.md"
repository = "https://github.com/iAeternus/ricky_redis_rs.git"
description = """
A Learning rust project that implements and extends mini_redis (https://github.com/tokio-rs/mini-redis)
"""

[[bin]]
name = "ricky-redis-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "ricky-redis-server"
path = "src/bin/server.rs"

[dependencies]
async-stream = "0.3.6"
atoi = "2.0.0"
bytes = "1.10.0"
clap = { version = "4.5.9", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.34"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
# Implements the types defined in the OTel spec
opentelemetry = { version = "0.28.0", optional = true }
# Integration between the tracing crate and the opentelemetry crate
tracing-opentelemetry = { version = "0.28.0", optional = true }
# Provides a "propagator" to pass along an XrayId across services
opentelemetry-aws = { version = "0.16.0", optional = true }
# Allows you to send data to the OTel collector
opentelemetry-otlp = { version = "0.28.0", optional = true }

[dev-dependencies]
# Enable test-utilities in dev mode only. This is mostly for tests.
tokio = { version = "1", features = ["test-util"] }

[features]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry", "dep:opentelemetry-aws", "dep:opentelemetry-otlp"]
